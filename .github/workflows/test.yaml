name: test

on:
  push:
    paths:
      - '.github/workflows/test.yaml'
      - '**.hpp'
      - '**.cpp'
      - '**/CMakeLists.txt'
  pull_request:
    paths:
      - '.github/workflows/test.yaml'
      - '**.hpp'
      - '**.cpp'
      - '**/CMakeLists.txt'

permissions: {}

jobs:
  ctest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
          # TODO: mingw, but see scan-build.yaml for why not. Contributions are welcome.

    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install dependencies (apt)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install coreutils build-essential libssl-dev
      - name: ctest
        run: |
          mkdir build
          cd build/
          cmake -D CMAKE_BUILD_TYPE=Debug ..
          cmake --build .
          ctest . -C Debug

  embuild:
    # Just build with emscripten. There is no way to test the build yet.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 5.0.7
          actions-cache-folder: 'emsdk-cache'
      - name: Verify emsdk
        run: emcc -v
      - name: build
        run: |
          mkdir build
          cd build/
          emcmake cmake ..
          emmake make
